<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listen</title>
<meta name="theme-color" content="#181c2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Listen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Instrument+Serif&display=swap">
<style>
:root{--bg:#eceef5;--glow:#f8f5fc;--ink:#262b42;--mute:#7d82a0;--line:#cfd3e4;--acc:#5662c9;--ok:#4f9a7d;--chip:#e0e3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181c2b;--glow:#242b47;--ink:#e7e9f4;--mute:#8a90b0;--line:#2d3350;--acc:#a9b3ff;--ok:#8fd0b3;--chip:#232940;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181c2b;--glow:#242b47;--ink:#e7e9f4;--mute:#8a90b0;--line:#2d3350;--acc:#a9b3ff;--ok:#8fd0b3;--chip:#232940;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 70% at 50% 0%,var(--glow),var(--bg));background-color:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:18px 22px 20px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:999px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{padding:6px 16px;border-radius:999px;color:var(--mute);transition:background .2s,color .2s}
.seg button.on{background:var(--bg);color:var(--ink)}
.rt{display:flex;gap:6px}
.pill{height:34px;min-width:38px;padding:0 13px;border-radius:999px;background:var(--chip)}
.sa{margin-top:10px;color:var(--mute);display:flex;align-items:center;gap:8px;justify-content:flex-end}
.sa select{background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font:inherit}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.big{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(120px,40vw,230px);line-height:1;letter-spacing:-.02em;transition:opacity .6s;white-space:nowrap}
.big.sg{font-size:clamp(90px,30vw,170px)}
.big.dim{opacity:.22}
.big sup{font-size:.4em;vertical-align:.95em;margin-left:.04em}
.big sub{font-size:.4em;margin-left:.04em}
.big .o{font-size:.26em;color:var(--mute);margin-left:.08em;letter-spacing:0}
.sub{color:var(--mute);min-height:24px;max-width:290px}
.meter{position:relative;width:min(300px,76%);height:22px}
.meter:before{content:"";position:absolute;left:0;right:0;top:10px;height:1px;background:var(--line)}
.meter i{position:absolute;left:50%;top:6px;width:1px;height:9px;background:var(--mute);opacity:.5}
.meter b{position:absolute;top:5px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--acc);transition:left .09s linear,background .2s}
.meter b.ok{background:var(--ok)}
.meter.off{display:none}
.go{width:160px;height:160px;border-radius:50%;border:1px solid var(--line);font:400 26px/1.15 "Instrument Serif",Georgia,serif;padding:0 22px;transition:border-color .3s}
.go:hover{border-color:var(--acc)}
.phr{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:14px}
.hint{color:var(--mute);font-size:13px;margin-bottom:10px}
.chips{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.c{background:var(--chip);border-radius:16px;padding:6px 12px 9px;text-align:center;transition:background .15s,color .15s}
.c .n{font:400 32px/1.1 "Instrument Serif",Georgia,serif;display:block;white-space:nowrap}
.c .n .o{font-size:.5em;color:var(--mute);margin-left:2px}
.c .n sup{font-size:.55em;vertical-align:.45em}
.c .n sub{font-size:.55em}
.c s{display:block;height:2px;border-radius:2px;background:var(--acc);opacity:.55;margin:5px auto 0}
.c.sel{outline:2px solid var(--acc)}
.c.now{background:var(--acc);color:var(--bg)}
.c.now .n .o{color:var(--bg)}
.c.now s{background:var(--bg)}
.e{color:var(--mute);padding:10px 0}
.ed{display:flex;gap:6px;justify-content:center;padding-top:10px;flex-wrap:wrap}
.ed button{background:var(--chip);border-radius:999px;padding:6px 13px}
.tr{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0 4px}
.tr button.st{width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:20px}
.tr .v{min-width:110px;text-align:center}
.tr .v b{display:block;font:400 28px/1.1 "Instrument Serif",Georgia,serif}
.tr .v span{color:var(--mute);font-size:13px}
.bar{display:flex;justify-content:space-around;margin-top:8px;min-height:34px}
.bar button{padding:6px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="seg" role="group" aria-label="Mode"><button id="mP" class="on">Phrase</button><button id="mL">Live</button></div>
  <div class="rt"><button class="pill" id="nt" aria-label="Notation">ABC</button><button class="pill" id="fl" aria-label="Sharps or flats">♯</button></div>
</div>
<div class="sa" id="saRow" hidden><label for="sa">Sa is</label><select id="sa"></select></div>

<div class="stage" id="stage">
  <button class="go" id="go">Hear a phrase</button>
  <div class="big dim" id="big" hidden>—</div>
  <div class="meter off" id="meter"><i></i><b id="dot"></b></div>
  <div class="sub" id="sub"></div>
</div>

<div class="phr" id="phr" hidden>
  <div class="hint">Tap a note to hear it and fix it.</div>
  <div class="chips" id="chips"></div>
  <div class="ed" id="ed" hidden>
    <button data-d="-12">−8ve</button><button data-d="-1">−1</button><button data-d="1">+1</button><button data-d="12">+8ve</button><button data-d="x">Delete</button>
  </div>
</div>

<div class="tr">
  <button class="st" id="dn" aria-label="Transpose down">−</button>
  <button class="v" id="rs" aria-label="Reset transpose"><b id="tv">0</b><span id="th">as heard</span></button>
  <button class="st" id="up" aria-label="Transpose up">+</button>
</div>
<div class="bar" id="bar"></div>

<script>
"use strict";
var $=function(i){return document.getElementById(i)};
var SH=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"],FL=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"],
    SG=["Sa","Re♭","Re","Ga♭","Ga","Ma","Ma♯","Pa","Dha♭","Dha","Ni♭","Ni"];
var S={mode:"phrase",st:"idle",tr:0,flat:false,sarg:false,sa:0,ph:[],sel:-1,play:false};
var ctx,an,stream,tb,timer,fr=[],voiceT=0,quietSince=0,pk=0;
try{var sv=JSON.parse(localStorage.getItem("lst")||"{}");S.flat=!!sv.flat;S.sarg=!!sv.sarg;S.sa=(sv.sa|0)%12}catch(e){}
function save(){try{localStorage.setItem("lst",JSON.stringify({flat:S.flat,sarg:S.sarg,sa:S.sa}))}catch(e){}}

/* ---------- labels ---------- */
function pcn(x){return (S.flat?FL:SH)[((x%12)+12)%12]}
function lab(m){
  var x=m+S.tr,n,a;
  if(S.sarg){
    var d=((x-S.sa)%12+12)%12,r=Math.floor((x-60-S.sa)/12),dots="•".repeat(Math.abs(r));
    return "<span>"+SG[d]+"</span>"+(r>0?"<sup>"+dots+"</sup>":r<0?"<sub>"+dots+"</sub>":"");
  }
  n=pcn(x);a=n.slice(1);
  return "<span>"+n[0]+"</span>"+(a?"<sup>"+a+"</sup>":"")+'<span class="o">'+(Math.floor(x/12)-1)+"</span>";
}
function txt(m){
  var x=m+S.tr;
  if(S.sarg){var d=((x-S.sa)%12+12)%12,r=Math.floor((x-60-S.sa)/12);return SG[d]+(r>0?"'".repeat(r):r<0?",".repeat(-r):"")}
  return pcn(x)+(Math.floor(x/12)-1);
}

/* ---------- pitch (YIN on a 2x downsampled recent window) ---------- */
function pitch(){
  an.getFloatTimeDomainData(tb);
  var N=2900,o=tb.length-N,n=N>>1,b=new Float32Array(n),i,j,t,s,x,W=700,r=0,base=n-W;
  for(i=0;i<n;i++)b[i]=(tb[o+2*i]+tb[o+2*i+1])/2;
  for(i=base;i<n;i++)r+=b[i]*b[i];
  r=Math.sqrt(r/W);
  if(r<.005)return{f:0,r:r};
  var T=base,d=new Float32Array(T),run=0,fs=ctx.sampleRate/2;
  for(t=1;t<T;t++){s=0;for(j=0;j<W;j++){x=b[base+j]-b[base+j-t];s+=x*x}run+=s;d[t]=s*t/run}
  for(t=Math.max(2,Math.floor(fs/4200));t<T-1;t++){
    if(d[t]<.13){
      while(t+1<T-1&&d[t+1]<d[t])t++;
      var a=d[t-1],c=d[t+1],p=(a-c)/(2*(a-2*d[t]+c)||1);
      return{f:fs/(t+p),r:r};
    }
  }
  return{f:0,r:r};
}

/* ---------- phrase segmentation ---------- */
function segment(fr){
  var n=fr.length,i,pr=0,v=[],w,out=[],cur=null,gap=0;
  fr.forEach(function(x){if(x.r>pr)pr=x.r});
  var gate=Math.max(.006,pr*.03);
  for(i=0;i<n;i++)v[i]=(fr[i].f&&fr[i].r>=gate)?69+12*Math.log2(fr[i].f/440):null;
  w=v.slice();
  for(i=1;i<n-1;i++)if(v[i]!==null&&v[i-1]!==null&&v[i+1]!==null)w[i]=[v[i-1],v[i],v[i+1]].sort(function(a,b){return a-b})[1];
  function close(){
    if(cur&&cur.p.length>=3){
      var p=cur.p,a=Math.floor(p.length*.2),z=Math.max(a+1,Math.ceil(p.length*.9)),
          q=p.slice(a,z).sort(function(x,y){return x-y}),m=Math.round(q[q.length>>1]),
          t=fr[cur.s].t,d=fr[cur.e].t-t+.03,L=out[out.length-1];
      if(L&&L.m===m&&!cur.on&&t-(L.t+L.d)<.12)L.d=t+d-L.t;
      else out.push({m:m,t:t,d:Math.max(.08,d)});
    }
    cur=null;
  }
  for(i=0;i<n;i++){
    var m=w[i],r=fr[i].r;
    if(m===null){if(cur&&++gap>=3)close();continue}
    gap=0;
    if(cur){
      var c=cur.p.slice(-4).reduce(function(a,b){return a+b},0)/Math.min(4,cur.p.length),
          onset=i-cur.s>=2&&r>1.5*cur.dip&&cur.dip<.75*cur.pk&&r>gate*3;
      if(Math.abs(m-c)>.7||onset){close();cur={s:i,e:i,p:[m],on:onset,pk:r,dip:r};continue}
      cur.p.push(m);cur.e=i;
      if(r>=cur.pk){cur.pk=r;cur.dip=r}else if(r<cur.dip)cur.dip=r;
    }else cur={s:i,e:i,p:[m],on:true,pk:r,dip:r};
  }
  close();
  return out;
}

/* ---------- audio loop ---------- */
async function start(){
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){$("sub").textContent="Mic is blocked. Allow it for this page, then tap again.";return}
  ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
  an=ctx.createAnalyser();an.fftSize=4096;an.smoothingTimeConstant=0;tb=new Float32Array(4096);
  ctx.createMediaStreamSource(stream).connect(an);
  if(S.mode==="live")startLoop();else arm();
  ui();
}
function startLoop(){clearInterval(timer);ctx.resume();timer=setInterval(tick,30)}
function arm(){S.st="arm";fr=[];quietSince=0;startLoop()}
function finish(){
  clearInterval(timer);ctx.suspend();
  S.ph=segment(fr);S.st="done";S.sel=-1;ui();
}
function tick(){
  var p=pitch(),now=ctx.currentTime,B=$("big");
  if(S.mode==="live"){
    if(!p.f){B.classList.add("dim");return}
    var mf=69+12*Math.log2(p.f/440),m=Math.round(mf),c=(mf-m)*100,dt=$("dot");
    B.classList.remove("dim");B.innerHTML=lab(m);
    $("sub").textContent=p.f.toFixed(1)+" Hz";
    dt.style.left=(50+Math.max(-50,Math.min(50,c))*.9)+"%";dt.className=Math.abs(c)<8?"ok":"";
    return;
  }
  if(S.st==="arm"){
    if(!(p.f&&p.r>.01))return;
    S.st="rec";fr=[];pk=0;voiceT=now;quietSince=0;ui();
  }
  if(S.st!=="rec")return;
  fr.push({t:now,f:p.f,r:p.r});if(p.r>pk)pk=p.r;
  if(p.f){B.classList.remove("dim");B.innerHTML=lab(Math.round(69+12*Math.log2(p.f/440)))}
  $("sub").textContent=(now-voiceT).toFixed(1)+" s";
  if(p.r<Math.max(.005,pk*.035)){if(!quietSince)quietSince=now;if(now-quietSince>1.8)finish()}else quietSince=0;
  if(now-voiceT>90)finish();
}

/* ---------- sound ---------- */
function tone(m,at,d){
  var f=440*Math.pow(2,(m-69)/12),g=ctx.createGain(),o=ctx.createOscillator(),o2=ctx.createOscillator(),g2=ctx.createGain();
  o.type="triangle";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*2;g2.gain.value=.25;
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(ctx.destination);
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.22,at+.01);g.gain.exponentialRampToValueAtTime(.0008,at+d+.25);
  o.start(at);o2.start(at);o.stop(at+d+.3);o2.stop(at+d+.3);
}
function snd(m){ctx.resume().then(function(){tone(m+S.tr,ctx.currentTime+.02,.5)})}
function mark(i){var c=$("chips").children,k;for(k=0;k<c.length;k++)c[k].classList.toggle("now",k===i)}
function play(){
  if(S.play||!S.ph.length)return;
  S.play=true;
  ctx.resume().then(function(){
    var base=S.ph[0].t,t0=ctx.currentTime+.12,end=0;
    S.ph.forEach(function(n,i){
      var at=t0+(n.t-base),d=Math.max(.14,n.d);
      tone(n.m+S.tr,at,d);end=Math.max(end,at+d);
      setTimeout(function(){mark(i)},(at-ctx.currentTime)*1000);
    });
    setTimeout(function(){S.play=false;mark(-1)},(end-ctx.currentTime)*1000+400);
  });
}
function copy(btn){
  var t=S.ph.map(function(n){return txt(n.m)}).join(" ");if(!t)return;
  var ok=function(){btn.textContent="Copied";setTimeout(function(){btn.textContent="Copy"},1200)};
  function alt(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}
  try{navigator.clipboard.writeText(t).then(ok,alt)}catch(e){alt()}
}

/* ---------- UI ---------- */
function chips(){
  $("chips").innerHTML=S.ph.length?S.ph.map(function(n,i){
    var w=Math.max(8,Math.min(64,n.d*42));
    return '<button class="c'+(i===S.sel?" sel":"")+'" data-i="'+i+'"><span class="n">'+lab(n.m)+'</span><s style="width:'+w+'px"></s></button>';
  }).join(""):'<div class="e">No clear notes caught. Try again closer to the piano, one line at a time.</div>';
}
function ed(){$("ed").hidden=S.sel<0}
function ui(){
  var ph=S.mode==="phrase",st=S.st,done=ph&&st==="done",B=$("big"),on=!!ctx;
  $("mP").className=ph?"on":"";$("mL").className=ph?"":"on";
  $("nt").textContent=S.sarg?"Sa":"ABC";$("fl").hidden=S.sarg;$("fl").textContent=S.flat?"♭":"♯";$("saRow").hidden=!S.sarg;
  $("phr").hidden=!done;$("stage").hidden=done;
  $("go").hidden=on;B.hidden=!on;$("go").textContent=ph?"Hear a phrase":"Listen";
  $("meter").className="meter"+(ph?" off":"");
  if(!(ph&&st==="rec")){B.className="big dim"+(S.sarg?" sg":"");B.textContent="—"}else B.className="big"+(S.sarg?" sg":"");
  if(!on)$("sub").textContent=ph?"Play a phrase. I start at your first note and stop when you pause.":"Play single notes and read them live.";
  else if(ph&&st==="arm")$("sub").textContent="Listening. Play when ready.";
  else if(!ph)$("sub").textContent="";
  $("bar").innerHTML=done?'<button data-a="again">↺ Again</button><button data-a="play">▶ Play</button><button data-a="copy">Copy</button>':(ph&&st==="rec"?'<button data-a="stop">Done</button>':"");
  if(done){chips();ed()}
}
function setTr(n){
  S.tr=Math.max(-12,Math.min(12,n));
  $("tv").textContent=S.tr>0?"+"+S.tr:""+S.tr;
  $("th").textContent=S.tr===0?"as heard":(S.tr>0?"up ":"down ")+Math.abs(S.tr)+(Math.abs(S.tr)===1?" semitone":" semitones");
  if(S.ph.length)chips();
}
function setMode(m){
  S.mode=m;clearInterval(timer);
  if(ctx){if(m==="live")startLoop();else if(S.ph.length)S.st="done";else arm()}
  ui();
}

$("go").onclick=start;
$("mP").onclick=function(){setMode("phrase")};$("mL").onclick=function(){setMode("live")};
$("up").onclick=function(){setTr(S.tr+1)};$("dn").onclick=function(){setTr(S.tr-1)};$("rs").onclick=function(){setTr(0)};
$("nt").onclick=function(){S.sarg=!S.sarg;save();ui();if(S.ph.length)chips()};
$("fl").onclick=function(){S.flat=!S.flat;save();ui();if(S.ph.length)chips()};
(function(){
  var o=["C","D♭","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
  $("sa").innerHTML=o.map(function(n,i){return '<option value="'+i+'"'+(i===S.sa?" selected":"")+">"+n+"</option>"}).join("");
})();
$("sa").onchange=function(){S.sa=+this.value;save();if(S.ph.length)chips()};
$("bar").onclick=function(e){
  var a=e.target.dataset.a;if(!a)return;
  if(a==="again"){S.ph=[];S.sel=-1;arm();ui()}
  else if(a==="stop")finish();
  else if(a==="play")play();
  else if(a==="copy")copy(e.target);
};
$("chips").onclick=function(e){
  var c=e.target.closest(".c");if(!c)return;
  S.sel=+c.dataset.i;chips();ed();snd(S.ph[S.sel].m);
};
$("ed").onclick=function(e){
  var a=e.target.dataset.d;if(a===undefined||S.sel<0)return;
  if(a==="x"){S.ph.splice(S.sel,1);S.sel=-1}else{S.ph[S.sel].m+=+a;snd(S.ph[S.sel].m)}
  chips();ed();
};
ui();setTr(0);
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
