<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transposed</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--bg:#f1ede8;--b1:rgba(150,140,255,.26);--b2:rgba(255,185,150,.34);--ink:#2a2a3c;--mute:#8a8798;--line:#d6d0d8;--acc:#6a5de0;--onacc:#fff;--glass:rgba(255,255,255,.6);--chip:rgba(60,50,110,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152a;--b1:rgba(120,105,235,.30);--b2:rgba(255,140,120,.13);--ink:#ece9f6;--mute:#8d8fb0;--line:#343a62;--acc:#ffb89c;--onacc:#2a1a1a;--glass:rgba(255,255,255,.06);--chip:rgba(255,255,255,.07);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12152a;--b1:rgba(120,105,235,.30);--b2:rgba(255,140,120,.13);--ink:#ece9f6;--mute:#8d8fb0;--line:#343a62;--acc:#ffb89c;--onacc:#2a1a1a;--glass:rgba(255,255,255,.06);--chip:rgba(255,255,255,.07);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(60% 45% at 15% 8%,var(--b1),transparent 70%),radial-gradient(70% 50% at 90% 92%,var(--b2),transparent 70%),var(--bg);background-color:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:16px 20px 18px;overflow:hidden}
button,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:999px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{font:italic 400 24px/1 "Instrument Serif",Georgia,serif;letter-spacing:-.01em}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{padding:5px 12px;border-radius:999px;color:var(--mute);transition:background .2s,color .2s}
.seg button.on{background:var(--glass);color:var(--ink);box-shadow:0 1px 0 var(--line) inset}
.opt{display:flex;gap:6px}
.pill{height:34px;min-width:38px;padding:0 12px;border-radius:999px;background:var(--chip)}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.orbw{width:min(66vw,270px);aspect-ratio:1;animation:br 6s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.035)}}
.orb{--h:250;--lv:0;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#1d2038;background:radial-gradient(circle at 34% 28%,hsl(var(--h) 90% 90%),hsl(var(--h) 68% 72%) 52%,hsl(var(--h) 52% 50%));box-shadow:0 0 calc(50px + var(--lv)*100px) hsl(var(--h) 80% 65%/.45),inset 0 -14px 34px hsl(var(--h) 60% 35%/.35);transform:scale(calc(1 + var(--lv)*.17));transition:transform .1s linear}
#on{font:400 clamp(76px,25vw,124px)/1 "Instrument Serif",Georgia,serif;letter-spacing:-.02em;white-space:nowrap;transition:opacity .4s}
#on.sm{font-size:24px;line-height:1.2;opacity:.7;font-style:italic}
#on sup{font-size:.42em;vertical-align:.9em;margin-left:.03em}
#on sub{font-size:.42em;margin-left:.03em}
#on .o{font-size:.26em;opacity:.55;margin-left:.08em;letter-spacing:0}
.orb.sg #on{font-size:clamp(56px,18vw,92px)}
.sub{margin:0;color:var(--mute);min-height:44px;max-width:270px}
.info{display:flex;flex-direction:column;align-items:center;gap:12px}
.meter{position:relative;width:min(240px,64vw);height:14px}
.meter:before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:var(--line)}
.meter i{position:absolute;left:50%;top:2px;width:1px;height:9px;background:var(--mute);opacity:.6}
.meter b{position:absolute;top:1px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--acc);transition:left .09s linear}
.score{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:16px}
.meta{font:italic 400 22px/1.2 "Instrument Serif",Georgia,serif;color:var(--mute)}
.roll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:6px -8px 0;padding:8px 8px 14px;scrollbar-width:none}
.roll::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:14px 6px;justify-items:center;align-items:start}
.grid.m{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:10px 4px}
.grid.m .nt{width:48px;height:36px;border-radius:18px;font-size:19px}
.grid.s{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px 3px}
.grid.s .nt{width:40px;height:30px;border-radius:15px;font-size:16px}
.nt{position:relative;width:58px;height:42px;border-radius:21px;display:grid;place-items:center;color:#1c1e34;font:400 22px/1 "Instrument Serif",Georgia,serif;white-space:nowrap;background:hsl(var(--h) 72% 78%);box-shadow:0 8px 20px hsl(var(--h) 70% 50%/.28);transition:transform .15s,box-shadow .15s}
.nt sup{font-size:.55em;vertical-align:.4em}
.nt sub{font-size:.55em}
.nt .o{font-size:.55em;opacity:.6;margin-left:1px}
.roll.sg .nt{font-size:18px}
.roll.sg .grid.m .nt,.roll.sg .grid.s .nt{font-size:14px}
.nt.sel{box-shadow:0 0 0 2px var(--ink),0 8px 20px hsl(var(--h) 70% 50%/.28)}
.nt.now{transform:scale(1.2);box-shadow:0 0 0 3px var(--acc),0 0 26px hsl(var(--h) 80% 65%/.7)}
.e{color:var(--mute);margin:auto;text-align:center;max-width:260px}
.ed{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding-top:6px}
.ed button{background:var(--chip);border-radius:999px;padding:6px 14px}
.hint{margin:10px 0 0;text-align:center;color:var(--mute);font-size:13px}
.dock{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:14px 16px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-top:12px}
.tr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tr .st{width:44px;height:44px;border-radius:50%;background:var(--chip);font-size:22px}
.tr .v{text-align:center;flex:1}
.tr .v b{display:block;font:400 30px/1.05 "Instrument Serif",Georgia,serif}
.tr .v span{color:var(--mute);font-size:13px}
.sa{margin-top:10px;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:8px}
.sa select{background:var(--chip);border:0;border-radius:999px;padding:5px 12px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;height:46px;border-radius:23px;background:var(--chip)}
.acts button.main{flex:1.4;background:var(--acc);color:var(--onacc);font-weight:500}
@media (orientation:landscape){
  body{max-width:940px;display:grid;grid-template-columns:1fr 232px;grid-template-rows:auto minmax(0,1fr);gap:8px 20px;padding:10px 22px 12px}
  .top{grid-column:1/3}
  .main{grid-column:1;grid-row:2}
  .dock{grid-column:2;grid-row:2;margin-top:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow-y:auto;padding:12px 14px}
  .stage{flex-direction:row;gap:30px}
  .orbw{width:min(50vh,240px)}
  #on{font-size:clamp(56px,27vh,112px)}
  #on.sm{font-size:20px}
  .orb.sg #on{font-size:clamp(44px,17vh,76px)}
  .info{align-items:flex-start;max-width:230px}
  .sub{text-align:left;min-height:0}
  .meter{width:190px}
  .score{padding-top:0}
  .meta{font-size:19px}
  .acts{flex-direction:column;margin-top:10px;gap:6px}
  .acts button{height:40px}
  .tr .st{width:40px;height:40px}
  .hint{margin-top:4px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="mark">transposed</div>
  <div class="seg" role="group" aria-label="Mode"><button id="mP" class="on">Phrase</button><button id="mL">Live</button></div>
  <div class="opt"><button class="pill" id="nt" aria-label="Notation">ABC</button><button class="pill" id="fl" aria-label="Sharps or flats">♯</button></div>
</header>

<main class="main">
  <section class="stage" id="stage">
    <div class="orbw"><button class="orb" id="orb" aria-label="Listen"><span id="on"></span></button></div>
    <div class="info"><p class="sub" id="sub"></p><div class="meter" id="meter"><i></i><b id="dot"></b></div></div>
  </section>
  <section class="score" id="score" hidden>
    <div class="meta" id="meta"></div>
    <div class="roll" id="roll"></div>
    <div class="ed" id="ed" hidden><button data-d="-12">−8ve</button><button data-d="-1">−1</button><button data-d="1">+1</button><button data-d="12">+8ve</button><button data-d="x">Delete</button></div>
    <p class="hint">Tap a note to hear it and fix it</p>
  </section>
</main>

<footer class="dock">
  <div class="tr">
    <button class="st" id="dn" aria-label="Transpose down">−</button>
    <button class="v" id="rs" aria-label="Reset transpose"><b id="tv">0</b><span id="th">as heard</span></button>
    <button class="st" id="up" aria-label="Transpose up">+</button>
  </div>
  <div class="sa" id="saRow" hidden><label for="sa">Sa is</label><select id="sa"></select></div>
  <div class="acts" id="acts" hidden></div>
</footer>

<script>
"use strict";
var $=function(i){return document.getElementById(i)};
var SH=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"],FL=["C","D♭","D","E♭","E","F","G♭","G","A♭","A","B♭","B"],
    SG=["Sa","Re♭","Re","Ga♭","Ga","Ma","Ma♯","Pa","Dha♭","Dha","Ni♭","Ni"];
var S={mode:"phrase",st:"idle",tr:0,flat:false,sarg:false,sa:0,ph:[],sel:-1,play:false};
var pkv=0,ctx,an,proc,zero,src,stream,tb,chunks=[],ring=[],total=0,quietT=0,pk=0,lv=0,lastP=0,raf=0,FFT,master,wave;
try{var sv=JSON.parse(localStorage.getItem("lst")||"{}");S.flat=!!sv.flat;S.sarg=!!sv.sarg;S.sa=(sv.sa|0)%12}catch(e){}
function save(){try{localStorage.setItem("lst",JSON.stringify({flat:S.flat,sarg:S.sarg,sa:S.sa}))}catch(e){}}

/* ---------- labels ---------- */
function pcn(x){return (S.flat?FL:SH)[((x%12)+12)%12]}
function hue(m){return (((m+S.tr)%12+12)%12)*30}
function lab(m){
  var x=m+S.tr,n,a;
  if(S.sarg){
    var d=((x-S.sa)%12+12)%12,r=Math.floor((x-60-S.sa)/12),dots="•".repeat(Math.abs(r));
    return "<span>"+SG[d]+"</span>"+(r>0?"<sup>"+dots+"</sup>":r<0?"<sub>"+dots+"</sub>":"");
  }
  n=pcn(x);a=n.slice(1);
  return "<span>"+n[0]+"</span>"+(a?"<sup>"+a+"</sup>":"")+'<span class="o">'+(Math.floor(x/12)-1)+"</span>";
}
function txt(m){
  var x=m+S.tr;
  if(S.sarg){var d=((x-S.sa)%12+12)%12,r=Math.floor((x-60-S.sa)/12);return SG[d]+(r>0?"'".repeat(r):r<0?",".repeat(-r):"")}
  return pcn(x)+(Math.floor(x/12)-1);
}

/* ---------- FFT ---------- */
function mkfft(N){
  var rev=new Uint16Array(N),c=new Float32Array(N/2),s=new Float32Array(N/2),i,j,B=Math.log2(N);
  for(i=0;i<N;i++){var r=0;for(j=0;j<B;j++)if((i>>j)&1)r|=1<<(B-1-j);rev[i]=r}
  for(i=0;i<N/2;i++){c[i]=Math.cos(2*Math.PI*i/N);s[i]=-Math.sin(2*Math.PI*i/N)}
  return function(re,im){
    var i,j,k,l,t;
    for(i=0;i<N;i++){j=rev[i];if(j>i){t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
    for(l=2;l<=N;l<<=1){
      var h=l>>1,st=N/l;
      for(i=0;i<N;i+=l)for(k=0;k<h;k++){
        var wr=c[k*st],wi=s[k*st],p=i+k,q=p+h,xr=re[q]*wr-im[q]*wi,xi=re[q]*wi+im[q]*wr;
        re[q]=re[p]-xr;im[q]=im[p]-xi;re[p]+=xr;im[p]+=xi;
      }
    }
  };
}

/* ---------- pitch: YIN on a segment (forward window, octave-safe) ---------- */
function yinSeg(b,s,L,fs){
  var W=Math.min(640,L>>1),T=Math.min(760,L-W),t,j,x,sm,run=0,tm=Math.max(2,Math.floor(fs/4300)),d,g=9;
  if(W<160||T<tm+8)return 0;
  d=new Float32Array(T);
  for(t=1;t<T;t++){sm=0;for(j=0;j<W;j++){x=b[s+j]-b[s+j+t];sm+=x*x}run+=sm;d[t]=sm*t/(run||1)}
  for(t=tm;t<T-1;t++)if(d[t]<g)g=d[t];
  if(g>.45)return 0;
  for(t=tm;t<T-1;t++){
    if(d[t]<=g+.08&&d[t]<=d[t-1]&&d[t]<=d[t+1]){
      var a=d[t-1],c=d[t+1],p=(a-c)/(2*(a-2*d[t]+c)||1);
      return fs/(t+p);
    }
  }
  return 0;
}
/* live readout: latest ~70 ms of the analyser */
function pitch(){
  an.getFloatTimeDomainData(tb);
  var N=2900,o=tb.length-N,n=N>>1,b=new Float32Array(n),i,r=0;
  for(i=0;i<n;i++)b[i]=(tb[o+2*i]+tb[o+2*i+1])/2;
  for(i=n-700;i<n;i++)r+=b[i]*b[i];
  r=Math.sqrt(r/700);
  if(r<.0012)return 0;
  return yinSeg(b,0,n,ctx.sampleRate/2);
}

/* pitch from what is NEW after an attack (post-attack spectrum minus pre-attack spectrum), so ringing notes don't fool it */
var FFT2,NR=1;
function spec(b,s,L,K,outA){
  var N=4096,re=new Float32Array(N),im=new Float32Array(N),i,k;
  FFT2=FFT2||mkfft(N);
  for(i=0;i<L;i++)re[i]=(s+i>=0&&s+i<b.length?b[s+i]:0)*(.5-.5*Math.cos(2*Math.PI*i/(L-1)));
  FFT2(re,im);
  for(k=0;k<K;k++)outA[k]=Math.sqrt(re[k]*re[k]+im[k]*im[k])/L;
}
function novPitch(b,att,end,fs){
  var L=Math.min(2048,end-att-Math.round(.008*fs));
  if(L<480)return 0;
  var st=att+Math.round(.008*fs),pre=att-Math.round(.012*fs)-L,bh=fs/4096,K=Math.floor(5200/bh),A=new Float32Array(K),P=new Float32Array(K),D=new Float32Array(K),k,m,h;
  spec(b,st,L,K,A);
  if(pre>=0)spec(b,pre,L,K,P);
  for(k=1;k<K-1;k++)D[k]=Math.max(0,A[k]-1.1*Math.max(P[k-1],P[k],P[k+1]));
  var best=0,bm=0,sD=0,sA=0;
  for(k=1;k<K-1;k++){sD+=D[k];sA+=A[k]}
  NR=sD/(sA||1);
  for(m=28;m<=100;m++){
    var f=440*Math.pow(2,(m-69)/12),sc=0;
    for(h=1;h<=6;h++){
      var c=h*f/bh;if(c>=K-3)break;
      var lo=Math.max(1,Math.floor(c*.988)),hi=Math.min(K-2,Math.ceil(c*1.016)),mxv=0;
      for(k=lo;k<=hi;k++)if(D[k]>mxv)mxv=D[k];
      sc+=mxv/Math.sqrt(h);
    }
    if(sc>best){best=sc;bm=m}
  }
  return best>1e-5?bm:0;
}

/* ---------- offline phrase analysis: onsets first, then pitch per note ---------- */
function analyze(x,sr){
  var n=x.length>>1,b=new Float32Array(n),i,f,k,fs=sr/2,N=1024,H=160,pm=0;
  for(i=0;i<x.length;i++){var av=Math.abs(x[i]);if(av>pm)pm=av}
  if(pm<1e-4)return[];
  var gn=.5/pm;
  for(i=0;i<n;i++)b[i]=(x[2*i]+x[2*i+1])*.5*gn;
  var nf=Math.floor((n-N)/H)+1;if(nf<8)return[];
  var K=Math.min(N/2-2,Math.floor(5500*N/fs)),win=new Float32Array(N),re=new Float32Array(N),im=new Float32Array(N),
      pv=new Float32Array(K+2),cu=new Float32Array(K+2),fx=new Float32Array(nf),en=new Float32Array(nf),tmp;
  FFT=FFT||mkfft(N);
  for(i=0;i<N;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/(N-1));
  for(f=0;f<nf;f++){
    var o=f*H,s=0,e=0,c0=o+(N>>1)-H;
    for(i=0;i<N;i++){re[i]=b[o+i]*win[i];im[i]=0}
    FFT(re,im);
    for(k=1;k<=K;k++)cu[k]=Math.log(1+400*Math.sqrt(re[k]*re[k]+im[k]*im[k])/N);
    if(f>0)for(k=2;k<K;k++){var dd=cu[k]-Math.max(pv[k-1],pv[k],pv[k+1]);if(dd>0)s+=dd}
    fx[f]=s;
    for(i=0;i<2*H;i++){var q=b[c0+i];e+=q*q}
    en[f]=Math.sqrt(e/(2*H));
    tmp=pv;pv=cu;cu=tmp;
  }
  var mx=0,pe=0;
  for(f=0;f<nf;f++){if(fx[f]>mx)mx=fx[f];if(en[f]>pe)pe=en[f]}
  if(pe<.001)return[];
  var cs=new Float64Array(nf+1);
  for(f=0;f<nf;f++)cs[f+1]=cs[f]+fx[f];
  var w=Math.round(.3*fs/H),mg=Math.round(.045*fs/H),ons=[];
  for(f=2;f<nf-2;f++){
    var a0=Math.max(0,f-w),a1=Math.min(nf,f+w+1),loc=(cs[a1]-cs[a0])/(a1-a0);
    if(fx[f]>loc*1.25+mx*.025&&fx[f]>=fx[f-1]&&fx[f]>=fx[f+1]&&fx[f]>=fx[f-2]&&fx[f]>=fx[f+2]&&Math.max(en[f],en[f+1],en[f+2],en[f+3])>pe*.012){
      var Lp=ons.length?ons[ons.length-1]:-99;
      if(f-Lp>=mg)ons.push(f);else if(fx[f]>fx[Lp])ons[ons.length-1]=f;
    }
  }
  var out=[],off=Math.round(N*.55);
  for(var qn=0;qn<ons.length;qn++){
    var of=ons[qn],att=of*H+off,last=qn+1>=ons.length,nx=last?n:ons[qn+1]*H+off,end=nx-Math.round(.006*fs),ms=[],j;
    [.03,.065,.1,.14].forEach(function(dt){
      var st=att+Math.round(dt*fs),Lw=Math.min(end-st,1500);
      if(Lw<420)return;
      var f0=yinSeg(b,st,Lw,fs);if(f0)ms.push(69+12*Math.log2(f0/440));
    });
    if(!ms.length){
      var s2=att+Math.round(.012*fs),L2=Math.min(end-s2,1500),g0=L2>=330?yinSeg(b,s2,L2,fs):0;
      if(g0)ms.push(69+12*Math.log2(g0/440));
    }
    ms.sort(function(p,r){return p-r});
    var m=ms.length?Math.round(ms[ms.length>>1]):0,hn=novPitch(b,att,end,fs),eP=0,eA=0;
    for(j=Math.max(0,att-Math.round(.03*fs));j<att-Math.round(.005*fs);j++)eP+=b[j]*b[j];
    for(j=att+Math.round(.01*fs);j<Math.min(n,att+Math.round(.05*fs));j++)eA+=b[j]*b[j];
    var ringing=eP>.1*eA;
    if(hn&&(!m||ringing||Math.abs(hn-m)<=1))m=hn;
    if(ringing&&NR<.12&&out.length)m=out[out.length-1].m;
    if(!m)continue;
    if(m<21||m>108)continue;
    var lim=last?nf:ons[qn+1],pkE=0;
    for(j=of;j<lim;j++)if(en[j]>pkE)pkE=en[j];
    var ef=of;while(ef<lim-1&&en[ef]>pkE*.1)ef++;
    var P=out.length?out[out.length-1]:null;
    if(P&&P.m===m){
      var pre=1e9,po=0;
      for(j=Math.max(0,of-6);j<=of-3;j++)if(en[j]<pre)pre=en[j];
      for(j=of;j<=Math.min(nf-1,of+4);j++)if(en[j]>po)po=en[j];
      if(po<pre*1.4&&fx[of]<.3*mx){P.d=Math.max(P.d,(ef-P.of)*H/fs);continue}
    }
    out.push({m:m,t:att/fs,d:Math.max(.08,(ef-of)*H/fs),v:Math.max(.35,Math.min(1,Math.sqrt(pkE/pe))),of:of});
  }
  return out;
}

/* ---------- mic ---------- */
async function openMic(){
  if(src)return true;
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    an=ctx.createAnalyser();an.fftSize=4096;an.smoothingTimeConstant=0;tb=new Float32Array(4096);
    proc=ctx.createScriptProcessor(2048,1,1);proc.onaudioprocess=onaudio;
    zero=ctx.createGain();zero.gain.value=0;proc.connect(zero);zero.connect(ctx.destination);
  }
  ctx.resume();
  try{navigator.audioSession.type="play-and-record"}catch(e){}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
  catch(e){$("sub").textContent="Mic is blocked. Allow it for this page, then tap again.";return false}
  await ctx.resume();
  src=ctx.createMediaStreamSource(stream);src.connect(an);src.connect(proc);
  return true;
}
function closeMic(){
  if(!src)return;
  try{src.disconnect()}catch(e){}
  stream.getTracks().forEach(function(t){t.stop()});src=null;
}
function onaudio(e){
  if(S.mode!=="phrase"||(S.st!=="arm"&&S.st!=="rec"))return;
  var d=e.inputBuffer.getChannelData(0),i,s=0;
  for(i=0;i<d.length;i++)s+=d[i]*d[i];
  var r=Math.sqrt(s/d.length),dur=d.length/ctx.sampleRate;
  if(S.st==="arm"){
    ring.push(new Float32Array(d));if(ring.length>3)ring.shift();
    if(r>.004){chunks=ring.slice();ring=[];total=0;chunks.forEach(function(c){total+=c.length});pk=r;quietT=0;S.st="rec";ui()}
  }else{
    chunks.push(new Float32Array(d));total+=d.length;if(r>pk)pk=r;
    if(r<Math.max(.002,pk*.045)){quietT+=dur;if(quietT>1.6)finish()}else quietT=0;
    if(total/ctx.sampleRate>90)finish();
  }
}
function finish(){
  if(S.st!=="rec")return;
  S.st="busy";closeMic();
  var x=new Float32Array(total),o=0;
  chunks.forEach(function(c){x.set(c,o);o+=c.length});chunks=[];
  ui();
  setTimeout(function(){
    try{S.ph=analyze(x,ctx.sampleRate)}catch(e){S.ph=[]}
    S.st="done";S.sel=-1;ui();
  },50);
}

/* ---------- live visuals + readout ---------- */
function startVis(){if(!raf)raf=requestAnimationFrame(vis)}
function vis(t){
  raf=0;
  var live=S.mode==="live"&&src,rec=S.mode==="phrase"&&src&&(S.st==="arm"||S.st==="rec");
  if(!(live||rec)){$("orb").style.setProperty("--lv",0);lv=0;return}
  raf=requestAnimationFrame(vis);
  an.getFloatTimeDomainData(tb);
  var i,s=0,O=$("on");
  for(i=tb.length-1024;i<tb.length;i++)s+=tb[i]*tb[i];
  var rr=Math.sqrt(s/1024);pkv=Math.max(pkv*.996,rr);lv+=(Math.min(1,rr/Math.max(pkv,.015))-lv)*.35;
  $("orb").style.setProperty("--lv",lv.toFixed(3));
  if(t-lastP<45)return;lastP=t;
  if(S.st==="rec")$("sub").textContent=(total/ctx.sampleRate).toFixed(1)+" s";
  var f=pitch();
  if(!f){O.style.opacity=.3;return}
  var mf=69+12*Math.log2(f/440),m=Math.round(mf),c=(mf-m)*100;
  O.style.opacity=1;O.innerHTML=lab(m);$("orb").style.setProperty("--h",hue(m));
  if(live){
    $("sub").textContent=f.toFixed(1)+" Hz";
    $("dot").style.left=(50+Math.max(-50,Math.min(50,c))*.9)+"%";
  }
}

/* ---------- sound (loud, piano-ish) ---------- */
function out(){
  if(master)return master;
  var c=ctx.createDynamicsCompressor();c.threshold.value=-12;c.ratio.value=5;c.attack.value=.003;c.release.value=.2;
  master=ctx.createGain();master.gain.value=2.6;master.connect(c);c.connect(ctx.destination);
  return master;
}
function tone(m,at,d,v){
  if(!wave){var re=new Float32Array([0,1,.8,.55,.36,.24,.16,.1,.06]);wave=ctx.createPeriodicWave(re,new Float32Array(re.length))}
  var o=ctx.createOscillator(),g=ctx.createGain(),p=.6*(v||.8),L=Math.max(d,.2);
  o.setPeriodicWave(wave);o.frequency.value=440*Math.pow(2,(m-69)/12);o.connect(g);g.connect(out());
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(p,at+.006);
  g.gain.exponentialRampToValueAtTime(p*.4,at+.12);g.gain.exponentialRampToValueAtTime(.0005,at+L+.7);
  o.start(at);o.stop(at+L+.8);
}
function wake(cb){
  try{navigator.audioSession.type="playback"}catch(e){}
  ctx.resume().then(cb);
}
function snd(m,v){wake(function(){tone(m+S.tr,ctx.currentTime+.02,.5,v)})}
function mark(i){var c=document.querySelectorAll(".nt"),k;for(k=0;k<c.length;k++)c[k].classList.toggle("now",k===i)}
function play(){
  if(S.play||!S.ph.length)return;
  S.play=true;
  wake(function(){
    var b0=S.ph[0].t,t0=ctx.currentTime+.12,end=0;
    S.ph.forEach(function(n,i){
      var at=t0+(n.t-b0),d=Math.max(.18,n.d);
      tone(n.m+S.tr,at,d,n.v);end=Math.max(end,at+d);
      setTimeout(function(){mark(i)},(at-ctx.currentTime)*1000);
    });
    setTimeout(function(){S.play=false;mark(-1)},(end-ctx.currentTime)*1000+500);
  });
}
function copy(btn){
  var t=S.ph.map(function(n){return txt(n.m)}).join(" ");if(!t)return;
  var ok=function(){btn.textContent="Copied";setTimeout(function(){btn.textContent="Copy"},1200)};
  function alt(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}
  try{navigator.clipboard.writeText(t).then(ok,alt)}catch(e){alt()}
}

/* ---------- score view ---------- */
function score(){
  var ph=S.ph,R=$("roll");
  R.className="roll"+(S.sarg?" sg":"");
  if(!ph.length){$("meta").textContent="";R.innerHTML='<div class="e">No clear notes caught. Try again, a little closer to the piano.</div>';return}
  var last=ph[ph.length-1],lo=1e9,hi=-1e9;
  $("meta").textContent=ph.length+(ph.length===1?" note":" notes")+" · "+(last.t+last.d-ph[0].t).toFixed(1)+" s";
  ph.forEach(function(n){if(n.m<lo)lo=n.m;if(n.m>hi)hi=n.m});
  var rg=Math.max(7,hi-lo),sz=ph.length>56?" s":ph.length>26?" m":"";
  R.innerHTML='<div class="grid'+sz+'">'+ph.map(function(n,i){
    return '<button class="nt'+(i===S.sel?" sel":"")+'" data-i="'+i+'" style="margin-top:'+((hi-n.m)/rg*(sz?10:18)).toFixed(1)+"px;--h:"+hue(n.m)+'">'+lab(n.m)+"</button>";
  }).join("")+"</div>";
}
function ed(){$("ed").hidden=S.sel<0}

/* ---------- UI ---------- */
function ui(){
  var ph=S.mode==="phrase",st=S.st,done=ph&&st==="done",on=!!src,busy=st==="busy",O=$("on"),sub=null;
  $("mP").className=ph?"on":"";$("mL").className=ph?"":"on";
  $("nt").textContent=S.sarg?"Sa":"ABC";$("fl").hidden=S.sarg;$("fl").textContent=S.flat?"♭":"♯";$("saRow").hidden=!S.sarg;
  $("stage").hidden=done;$("score").hidden=!done;$("meter").hidden=ph;
  $("orb").className="orb"+(S.sarg?" sg":"");$("orb").style.setProperty("--h",250);
  O.style.opacity=1;
  if(busy){O.className="sm";O.textContent="reading…";sub=""}
  else if(!on){O.className="sm";O.innerHTML="tap to<br>listen";sub=ph?"Play a phrase. I start at your first note and stop when you pause.":"Play single notes and read them live."}
  else if(ph&&st==="arm"){O.className="";O.textContent="—";sub="Listening. Play when ready."}
  else if(ph&&st==="rec"){O.className="";sub="Hearing you. Tap the orb when finished."}
  else{O.className="";O.textContent="—";sub=""}
  if(sub!==null)$("sub").textContent=sub;
  $("acts").hidden=!done;
  $("acts").innerHTML=done?'<button data-a="again">↺ Again</button><button data-a="copy">Copy</button><button class="main" data-a="play">▶ Play</button>':"";
  if(done){score();ed()}
}
function setTr(n){
  S.tr=Math.max(-12,Math.min(12,n));
  $("tv").textContent=S.tr>0?"+"+S.tr:""+S.tr;
  $("th").textContent=S.tr===0?"as heard":(S.tr>0?"up ":"down ")+Math.abs(S.tr)+(Math.abs(S.tr)===1?" semitone":" semitones");
  if(S.st==="done"&&S.mode==="phrase"){score();ed()}
}
function setMode(m){
  S.mode=m;closeMic();
  S.st=(m==="phrase"&&S.ph.length)?"done":"idle";
  ui();
}

$("orb").onclick=async function(){
  if(S.st==="busy")return;
  if(S.mode==="phrase"){
    if(S.st==="rec"){finish();return}
    if(S.st==="arm"){closeMic();S.st="idle";ui();return}
    ring=[];
    if(await openMic()){S.st="arm";ui();startVis()}
  }else{
    if(src){closeMic();ui();return}
    if(await openMic()){ui();startVis()}
  }
};
$("mP").onclick=function(){setMode("phrase")};$("mL").onclick=function(){setMode("live")};
$("up").onclick=function(){setTr(S.tr+1)};$("dn").onclick=function(){setTr(S.tr-1)};$("rs").onclick=function(){setTr(0)};
$("nt").onclick=function(){S.sarg=!S.sarg;save();ui()};
$("fl").onclick=function(){S.flat=!S.flat;save();ui()};
(function(){
  var o=["C","D♭","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];
  $("sa").innerHTML=o.map(function(n,i){return '<option value="'+i+'"'+(i===S.sa?" selected":"")+">"+n+"</option>"}).join("");
})();
$("sa").onchange=function(){S.sa=+this.value;save();ui()};
$("acts").onclick=async function(e){
  var a=e.target.dataset.a;if(!a)return;
  if(a==="again"){S.ph=[];S.sel=-1;ring=[];if(await openMic()){S.st="arm";ui();startVis()}else{S.st="idle";ui()}}
  else if(a==="play")play();
  else if(a==="copy")copy(e.target);
};
$("roll").onclick=function(e){
  var c=e.target.closest(".nt");if(!c)return;
  S.sel=+c.dataset.i;score();ed();snd(S.ph[S.sel].m,S.ph[S.sel].v);
};
$("ed").onclick=function(e){
  var a=e.target.dataset.d;if(a===undefined||S.sel<0)return;
  if(a==="x"){S.ph.splice(S.sel,1);S.sel=-1}else{S.ph[S.sel].m+=+a;snd(S.ph[S.sel].m,S.ph[S.sel].v)}
  score();ed();
};
ui();setTr(0);
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
